name: Update List
on:
  schedule:
    - cron: '17/15 13-21 * * *'
    - cron: '17 0-12 * * *'
    - cron: '17 22-23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Run generation script
        env:
          DONETICK_TOKEN: ${{ secrets.DONETICK_TOKEN }}
          DONETICK_USERNAME: ${{ secrets.DONETICK_USERNAME }}
          DONETICK_PASSWORD: ${{ secrets.DONETICK_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uv run generate-html.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5